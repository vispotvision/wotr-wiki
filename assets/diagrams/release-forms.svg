<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="'Cormorant Garamond', 'EB Garamond', Garamond, Georgia, serif"><defs><radialGradient id="glow" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#3a2a12"/><stop offset="1" stop-color="#110d09"/></radialGradient></defs><rect width="1000" height="660" rx="14" fill="url(#glow)"/><rect x="8" y="8" width="984" height="644" rx="10" fill="none" stroke="#d8ab4f" stroke-opacity=".45"/><text x="500.0" y="58" text-anchor="middle" fill="#d8ab4f" font-size="34" font-weight="600" letter-spacing="3">RELEASES BY PATH</text><text x="500.0" y="88" text-anchor="middle" fill="#a8957a" font-size="19" font-style="italic" font-family="'Crimson Pro', Georgia, serif">The lead Path sets how many, each deeper than the last; a Walked Path colors them and brings none</text><path d="M380.0 100 L488.0 100 M512.0 100 L620.0 100" stroke="#d8ab4f" stroke-opacity=".5"/><polygon points="500.0,94 506.0,100 500.0,106 494.0,100" fill="#d8ab4f"/><rect x="50" y="118" width="280" height="404" rx="12" fill="#9fd6ff" fill-opacity="0.05" stroke="#9fd6ff" stroke-opacity=".55"/><circle cx="190" cy="152" r="12" fill="none" stroke="#9fd6ff" stroke-opacity="0.85" stroke-width="2.4"/><circle cx="190" cy="152" r="22" fill="none" stroke="#9fd6ff" stroke-opacity="0.63" stroke-width="1.9"/><circle cx="190" cy="152" r="32" fill="none" stroke="#9fd6ff" stroke-opacity="0.41" stroke-width="1.4"/><polygon points="190,142 197,152 190,162 183,152" fill="#fff2c4"/><text x="190" y="206" font-size="16" fill="#9fd6ff" text-anchor="middle" font-weight="700" letter-spacing="3">THE BODY</text><text x="190" y="225" font-size="15" fill="#a8957a" text-anchor="middle" font-weight="normal" font-style="italic" font-family="'Crimson Pro', Georgia, serif">three Releases</text><text x="190" y="262" font-size="22" fill="#d8ab4f" text-anchor="middle" font-weight="600" >First Release</text><text x="190" y="281" font-size="14" fill="#a8957a" text-anchor="middle" font-weight="normal" font-style="italic" font-family="'Crimson Pro', Georgia, serif">Stage IV · Flourishing</text><text x="190" y="302" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif">the body broken,</text><text x="190" y="321" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif">refusing to fall</text><text x="190" y="356" font-size="22" fill="#d8ab4f" text-anchor="middle" font-weight="600" >Second Release</text><text x="190" y="375" font-size="14" fill="#a8957a" text-anchor="middle" font-weight="normal" font-style="italic" font-family="'Crimson Pro', Georgia, serif">Stage VII · Refraction</text><text x="190" y="396" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif">a material known so well</text><text x="190" y="415" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif">it obeys at range</text><text x="190" y="450" font-size="22" fill="#d8ab4f" text-anchor="middle" font-weight="600" >Third Release</text><text x="190" y="469" font-size="14" fill="#a8957a" text-anchor="middle" font-weight="normal" font-style="italic" font-family="'Crimson Pro', Georgia, serif">Stage IX · Invocation</text><text x="190" y="490" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif">the body remade</text><text x="190" y="509" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif">around a wound</text><rect x="360" y="118" width="280" height="404" rx="12" fill="#d8ab4f" fill-opacity="0.05" stroke="#d8ab4f" stroke-opacity=".55"/><circle cx="500" cy="152" r="12" fill="none" stroke="#d8ab4f" stroke-opacity="0.85" stroke-width="2.4"/><circle cx="500" cy="152" r="22" fill="none" stroke="#d8ab4f" stroke-opacity="0.63" stroke-width="1.9"/><polygon points="500,142 507,152 500,162 493,152" fill="#fff2c4"/><text x="500" y="206" font-size="16" fill="#d8ab4f" text-anchor="middle" font-weight="700" letter-spacing="3">THE SPIRIT</text><text x="500" y="225" font-size="15" fill="#a8957a" text-anchor="middle" font-weight="normal" font-style="italic" font-family="'Crimson Pro', Georgia, serif">two Releases</text><text x="500" y="262" font-size="22" fill="#d8ab4f" text-anchor="middle" font-weight="600" >First Release</text><text x="500" y="281" font-size="14" fill="#a8957a" text-anchor="middle" font-weight="normal" font-style="italic" font-family="'Crimson Pro', Georgia, serif">Stage IV · Flourishing</text><text x="500" y="302" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif">the self said aloud,</text><text x="500" y="321" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif">and true</text><text x="500" y="356" font-size="22" fill="#d8ab4f" text-anchor="middle" font-weight="600" >Second Release</text><text x="500" y="375" font-size="14" fill="#a8957a" text-anchor="middle" font-weight="normal" font-style="italic" font-family="'Crimson Pro', Georgia, serif">Stage VII · Refraction</text><text x="500" y="396" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif">a meaning borne</text><text x="500" y="415" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif">for someone else</text><rect x="670" y="118" width="280" height="404" rx="12" fill="#c89bff" fill-opacity="0.05" stroke="#c89bff" stroke-opacity=".55"/><circle cx="810" cy="152" r="12" fill="none" stroke="#c89bff" stroke-opacity="0.85" stroke-width="2.4"/><polygon points="810,142 817,152 810,162 803,152" fill="#fff2c4"/><text x="810" y="206" font-size="16" fill="#c89bff" text-anchor="middle" font-weight="700" letter-spacing="3">FATE</text><text x="810" y="225" font-size="15" fill="#a8957a" text-anchor="middle" font-weight="normal" font-style="italic" font-family="'Crimson Pro', Georgia, serif">one Release</text><text x="810" y="262" font-size="22" fill="#d8ab4f" text-anchor="middle" font-weight="600" >The One</text><text x="810" y="281" font-size="14" fill="#a8957a" text-anchor="middle" font-weight="normal" font-style="italic" font-family="'Crimson Pro', Georgia, serif">Stage VII · Refraction</text><text x="810" y="302" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif">a claim staked on your life,</text><text x="810" y="321" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif">and kept</text><text x="810" y="358" font-size="15" fill="#f0d48a" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif">Deeper than any First, it</text><text x="810" y="377" font-size="15" fill="#f0d48a" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif">counts as the Second: it opens</text><text x="810" y="396" font-size="15" fill="#f0d48a" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif">the Domain and powers it.</text><rect x="50" y="534" width="435" height="106" rx="10" fill="#d8ab4f" fill-opacity=".07" stroke="#d8ab4f" stroke-opacity=".55"/><text x="72" y="562" font-size="22" fill="#d8ab4f" text-anchor="start" font-weight="600" >Domain</text><text x="463" y="562" font-size="14" fill="#a8957a" text-anchor="end" font-weight="normal" font-style="italic" font-family="'Crimson Pro', Georgia, serif">from Stage VIII · Transcendence</text><text x="72" y="587" font-size="15" fill="#f1e4c6" text-anchor="start" font-weight="normal" font-family="'Crimson Pro', Georgia, serif">A seed may flicker once at Refraction. Only a</text><text x="72" y="606" font-size="15" fill="#f1e4c6" text-anchor="start" font-weight="normal" font-family="'Crimson Pro', Georgia, serif">Second Release, or the One, calls a Domain</text><text x="72" y="625" font-size="15" fill="#f1e4c6" text-anchor="start" font-weight="normal" font-family="'Crimson Pro', Georgia, serif">up and holds it.</text><rect x="515" y="534" width="435" height="106" rx="10" fill="#d8ab4f" fill-opacity=".07" stroke="#d8ab4f" stroke-opacity=".55"/><text x="537" y="562" font-size="22" fill="#d8ab4f" text-anchor="start" font-weight="600" >The Realm</text><text x="928" y="562" font-size="14" fill="#a8957a" text-anchor="end" font-weight="normal" font-style="italic" font-family="'Crimson Pro', Georgia, serif">from Stage X · Realization</text><text x="537" y="587" font-size="15" fill="#f1e4c6" text-anchor="start" font-weight="normal" font-family="'Crimson Pro', Georgia, serif">Every road reaches it late, by its own door:</text><text x="537" y="606" font-size="15" fill="#f1e4c6" text-anchor="start" font-weight="normal" font-family="'Crimson Pro', Georgia, serif">Body through the Third, Spirit through the</text><text x="537" y="625" font-size="15" fill="#f1e4c6" text-anchor="start" font-weight="normal" font-family="'Crimson Pro', Georgia, serif">Second grown whole, Fate through the One.</text></svg>