<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 688" font-family="'Cormorant Garamond', 'EB Garamond', Garamond, Georgia, serif"><defs><linearGradient id="beam" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#5a5048"/><stop offset=".45" stop-color="#d8ab4f"/><stop offset=".8" stop-color="#fff2c4"/><stop offset="1" stop-color="#ffffff"/></linearGradient><filter id="bl7"><feGaussianBlur stdDeviation="5"/></filter></defs><defs><radialGradient id="glow" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#3a2a12"/><stop offset="1" stop-color="#110d09"/></radialGradient></defs><rect width="1000" height="688" rx="14" fill="url(#glow)"/><rect x="8" y="8" width="984" height="672" rx="10" fill="none" stroke="#d8ab4f" stroke-opacity=".45"/><text x="500.0" y="58" text-anchor="middle" fill="#d8ab4f" font-size="34" font-weight="600" letter-spacing="3">MASTERY</text><text x="500.0" y="88" text-anchor="middle" fill="#a8957a" font-size="19" font-style="italic" font-family="'Crimson Pro', Georgia, serif">One rung on each Path a soul walks, read from Level under its Stage&#x2019;s ceiling, and never tracked</text><path d="M380.0 100 L488.0 100 M512.0 100 L620.0 100" stroke="#d8ab4f" stroke-opacity=".5"/><polygon points="500.0,94 506.0,100 500.0,106 494.0,100" fill="#d8ab4f"/><text x="72" y="136" font-size="15" fill="#a8957a" text-anchor="middle" letter-spacing="2">RUNG</text><text x="166" y="136" font-size="15" fill="#a8957a" text-anchor="middle" letter-spacing="2">FROM LEVEL</text><text x="386" y="136" font-size="21" fill="#9fd6ff" text-anchor="middle" font-weight="700" letter-spacing="1.5">BODY</text><text x="386" y="157" font-size="15.5" fill="#a8957a" text-anchor="middle" font-style="italic" font-family="'Crimson Pro', Georgia, serif">reads matter</text><text x="610" y="136" font-size="21" fill="#d8ab4f" text-anchor="middle" font-weight="700" letter-spacing="1.5">SPIRIT</text><text x="610" y="157" font-size="15.5" fill="#a8957a" text-anchor="middle" font-style="italic" font-family="'Crimson Pro', Georgia, serif">reads souls and meanings</text><text x="834" y="136" font-size="21" fill="#c89bff" text-anchor="middle" font-weight="700" letter-spacing="1.5">FATE</text><text x="834" y="157" font-size="15.5" fill="#a8957a" text-anchor="middle" font-style="italic" font-family="'Crimson Pro', Georgia, serif">reads odds and conditions</text><path d="M72 201.0 L72 491.0" fill="none" stroke="url(#beam)" stroke-width="9" filter="url(#bl7)" opacity=".7"/><path d="M72 201.0 L72 491.0" fill="none" stroke="url(#beam)" stroke-width="2.6"/><polygon points="72,177.0 90,201.0 72,225.0 54,201.0" fill="#8a6a4a" stroke="#d8ab4f" stroke-width="1.6"/><polygon points="72,177.0 90,201.0 72,201.0" fill="#ffffff" fill-opacity=".18"/><text x="72" y="207.0" font-size="17" fill="#fff4dc" text-anchor="middle" font-weight="700">I</text><text x="166" y="207.0" font-size="18" fill="#f1e4c6" text-anchor="middle" font-family="'Crimson Pro', Georgia, serif">115</text><text x="386" y="197.0" font-size="18" fill="#f1e4c6" text-anchor="middle" font-family="'Crimson Pro', Georgia, serif">the object</text><text x="386" y="215.0" font-size="13" fill="#9fd6ff" fill-opacity=".85" text-anchor="middle" font-weight="700" letter-spacing=".8">MURIDIC</text><text x="610" y="197.0" font-size="18" fill="#f1e4c6" text-anchor="middle" font-family="'Crimson Pro', Georgia, serif">hears</text><text x="610" y="215.0" font-size="13" fill="#d8ab4f" fill-opacity=".85" text-anchor="middle" font-weight="700" letter-spacing=".8">LISTENER</text><text x="834" y="197.0" font-size="18" fill="#f1e4c6" text-anchor="middle" font-family="'Crimson Pro', Georgia, serif">a lean</text><text x="834" y="215.0" font-size="13" fill="#c89bff" fill-opacity=".85" text-anchor="middle" font-weight="700" letter-spacing=".8">TOUCHED</text><rect x="120" y="230" width="850" height="58" fill="#ffffff" fill-opacity=".025"/><polygon points="72,235.0 90,259.0 72,283.0 54,259.0" fill="#b0904f" stroke="#d8ab4f" stroke-width="1.6"/><polygon points="72,235.0 90,259.0 72,259.0" fill="#ffffff" fill-opacity=".18"/><text x="72" y="265.0" font-size="17" fill="#fff4dc" text-anchor="middle" font-weight="700">II</text><text x="166" y="265.0" font-size="18" fill="#f1e4c6" text-anchor="middle" font-family="'Crimson Pro', Georgia, serif">150</text><text x="386" y="255.0" font-size="18" fill="#f1e4c6" text-anchor="middle" font-family="'Crimson Pro', Georgia, serif">by contact</text><text x="386" y="273.0" font-size="13" fill="#9fd6ff" fill-opacity=".85" text-anchor="middle" font-weight="700" letter-spacing=".8">HARMONIC</text><text x="610" y="255.0" font-size="18" fill="#f1e4c6" text-anchor="middle" font-family="'Crimson Pro', Georgia, serif">is answered</text><text x="610" y="273.0" font-size="13" fill="#d8ab4f" fill-opacity=".85" text-anchor="middle" font-weight="700" letter-spacing=".8">ANSWERER</text><text x="834" y="255.0" font-size="18" fill="#f1e4c6" text-anchor="middle" font-family="'Crimson Pro', Georgia, serif">a lean, held</text><text x="834" y="273.0" font-size="13" fill="#c89bff" fill-opacity=".85" text-anchor="middle" font-weight="700" letter-spacing=".8">DRAWN</text><polygon points="72,293.0 90,317.0 72,341.0 54,317.0" fill="#d8ab4f" stroke="#d8ab4f" stroke-width="1.6"/><polygon points="72,293.0 90,317.0 72,317.0" fill="#ffffff" fill-opacity=".18"/><text x="72" y="323.0" font-size="17" fill="#1a120a" text-anchor="middle" font-weight="700">III</text><text x="166" y="323.0" font-size="18" fill="#f1e4c6" text-anchor="middle" font-family="'Crimson Pro', Georgia, serif">215</text><text x="386" y="313.0" font-size="18" fill="#f1e4c6" text-anchor="middle" font-family="'Crimson Pro', Georgia, serif">by recognition</text><text x="386" y="331.0" font-size="13" fill="#9fd6ff" fill-opacity=".85" text-anchor="middle" font-weight="700" letter-spacing=".8">RESONANT</text><text x="610" y="313.0" font-size="18" fill="#f1e4c6" text-anchor="middle" font-family="'Crimson Pro', Georgia, serif">reads wholly</text><text x="610" y="331.0" font-size="13" fill="#d8ab4f" fill-opacity=".85" text-anchor="middle" font-weight="700" letter-spacing=".8">CONFESSOR</text><text x="834" y="313.0" font-size="18" fill="#f1e4c6" text-anchor="middle" font-family="'Crimson Pro', Georgia, serif">a prerequisite</text><text x="834" y="331.0" font-size="13" fill="#c89bff" fill-opacity=".85" text-anchor="middle" font-weight="700" letter-spacing=".8">SPINNER</text><rect x="120" y="346" width="850" height="58" fill="#ffffff" fill-opacity=".025"/><polygon points="72,351.0 90,375.0 72,399.0 54,375.0" fill="#efd78f" stroke="#d8ab4f" stroke-width="1.6"/><polygon points="72,351.0 90,375.0 72,375.0" fill="#ffffff" fill-opacity=".18"/><text x="72" y="381.0" font-size="17" fill="#1a120a" text-anchor="middle" font-weight="700">IV</text><text x="166" y="381.0" font-size="18" fill="#f1e4c6" text-anchor="middle" font-family="'Crimson Pro', Georgia, serif">260</text><text x="386" y="371.0" font-size="18" fill="#f1e4c6" text-anchor="middle" font-family="'Crimson Pro', Georgia, serif">by law</text><text x="386" y="389.0" font-size="13" fill="#9fd6ff" fill-opacity=".85" text-anchor="middle" font-weight="700" letter-spacing=".8">LUMINOUS</text><text x="610" y="371.0" font-size="18" fill="#f1e4c6" text-anchor="middle" font-family="'Crimson Pro', Georgia, serif">holds</text><text x="610" y="389.0" font-size="13" fill="#d8ab4f" fill-opacity=".85" text-anchor="middle" font-weight="700" letter-spacing=".8">SHEPHERD</text><text x="834" y="371.0" font-size="18" fill="#f1e4c6" text-anchor="middle" font-family="'Crimson Pro', Georgia, serif">a prerequisite, sure</text><text x="834" y="389.0" font-size="13" fill="#c89bff" fill-opacity=".85" text-anchor="middle" font-weight="700" letter-spacing=".8">KNOTWRIGHT</text><polygon points="72,409.0 90,433.0 72,457.0 54,433.0" fill="#fff0c0" stroke="#d8ab4f" stroke-width="1.6"/><polygon points="72,409.0 90,433.0 72,433.0" fill="#ffffff" fill-opacity=".18"/><text x="72" y="439.0" font-size="17" fill="#1a120a" text-anchor="middle" font-weight="700">V</text><text x="166" y="439.0" font-size="18" fill="#f1e4c6" text-anchor="middle" font-family="'Crimson Pro', Georgia, serif">340</text><text x="386" y="429.0" font-size="18" fill="#f1e4c6" text-anchor="middle" font-family="'Crimson Pro', Georgia, serif">by law, wide</text><text x="386" y="447.0" font-size="13" fill="#9fd6ff" fill-opacity=".85" text-anchor="middle" font-weight="700" letter-spacing=".8">RADIANT</text><text x="610" y="429.0" font-size="18" fill="#f1e4c6" text-anchor="middle" font-family="'Crimson Pro', Georgia, serif">holds many</text><text x="610" y="447.0" font-size="13" fill="#d8ab4f" fill-opacity=".85" text-anchor="middle" font-weight="700" letter-spacing=".8">FERRYMAN</text><text x="834" y="429.0" font-size="18" fill="#f1e4c6" text-anchor="middle" font-family="'Crimson Pro', Georgia, serif">a field</text><text x="834" y="447.0" font-size="13" fill="#c89bff" fill-opacity=".85" text-anchor="middle" font-weight="700" letter-spacing=".8">WEAVER</text><rect x="120" y="462" width="850" height="58" fill="#ffffff" fill-opacity=".025"/><polygon points="72,467.0 90,491.0 72,515.0 54,491.0" fill="#ffffff" stroke="#d8ab4f" stroke-width="1.6"/><polygon points="72,467.0 90,491.0 72,491.0" fill="#ffffff" fill-opacity=".18"/><text x="72" y="497.0" font-size="17" fill="#1a120a" text-anchor="middle" font-weight="700">&#x3A9;</text><text x="166" y="496.0" font-size="15" fill="#a8957a" text-anchor="middle" font-style="italic" font-family="'Crimson Pro', Georgia, serif">Paragon only</text><text x="386" y="497.0" font-size="18" fill="#f1e4c6" text-anchor="middle" font-family="'Crimson Pro', Georgia, serif">the whole system</text><text x="610" y="497.0" font-size="18" fill="#f1e4c6" text-anchor="middle" font-family="'Crimson Pro', Georgia, serif">all of it</text><text x="834" y="497.0" font-size="18" fill="#f1e4c6" text-anchor="middle" font-family="'Crimson Pro', Georgia, serif">all of it</text><line x1="730" y1="288" x2="938" y2="288" stroke="#c89bff" stroke-width="1.8" stroke-dasharray="6 5"/><rect x="726" y="279" width="216" height="18" rx="4" fill="#15100d"/><text x="834" y="293" font-size="13" fill="#c89bff" text-anchor="middle" font-style="italic" font-family="'Crimson Pro', Georgia, serif">no Work or blessing: Fate stops at II</text><rect x="54" y="532" width="892" height="44" rx="8" fill="#3a1d55" fill-opacity=".45" stroke="#c89bff" stroke-opacity=".6"/><text x="76" y="560" font-size="18" fill="#e9d6ff" text-anchor="start" font-weight="700" letter-spacing="1.5">INVERTED</text><text x="192" y="560" font-size="16" fill="#f1e4c6" text-anchor="start" font-family="'Crimson Pro', Georgia, serif">a mark on any rung, never a rung of its own: the feared, wrong way. <tspan font-style="italic" fill="#c89bff">Spirit IV Inverted.</tspan></text><text x="500.0" y="608" font-size="15" fill="#a8957a" text-anchor="middle" font-style="italic" font-family="'Crimson Pro', Georgia, serif">Ceilings by Stage: unread below VI · VI, I · VII, II · VIII and IX, III · X and XI, IV · XII to XIV, V · XV and XVI, &#x3A9;</text><text x="500.0" y="629" font-size="15" fill="#a8957a" text-anchor="middle" font-style="italic" font-family="'Crimson Pro', Georgia, serif">Yield (&#x3B7;) reads from the Mastery of the Path in use: about a third lost at I, under a tenth at III, more than promised at V.</text><text x="500.0" y="650" font-size="15" fill="#a8957a" text-anchor="middle" font-style="italic" font-family="'Crimson Pro', Georgia, serif">A Walked Path reads a rung behind the lead until mastered; a Studied one two behind, capped at II. Fate&#x2019;s price is the knot.</text><text x="500.0" y="671" font-size="15" fill="#a8957a" text-anchor="middle" font-style="italic" font-family="'Crimson Pro', Georgia, serif">The old ladder words stay as each road&#x2019;s folk names. A Class is another thing: a name the soul offers at Glory, with Mastery I.</text></svg>